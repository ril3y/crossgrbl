name: Build Firmware

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr

      - name: Create build directory
        run: mkdir -p build

      - name: Build inverted firmware (for Mach3 Crossfire)
        run: |
          make
          mv grbl.hex crossgrbl-inverted.hex
          make clean

      - name: Build standard firmware
        run: |
          # Temporarily change direction invert mask to 0 for standard version
          sed -i 's/DEFAULT_DIRECTION_INVERT_MASK ((1<<X_AXIS)|(1<<Y_AXIS))/DEFAULT_DIRECTION_INVERT_MASK 0/' grbl/defaults.h
          make
          mv grbl.hex crossgrbl-standard.hex
          # Restore original file
          git checkout grbl/defaults.h

      - name: Get version tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Rename firmware files with version
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mv crossgrbl-inverted.hex crossgrbl-inverted-${VERSION}.hex
          mv crossgrbl-standard.hex crossgrbl-standard-${VERSION}.hex

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crossgrbl-firmware
          path: |
            crossgrbl-inverted-*.hex
            crossgrbl-standard-*.hex
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            crossgrbl-inverted-*.hex
            crossgrbl-standard-*.hex
          body: |
            ## CrossGRBL Firmware Release

            This release includes **two firmware variants** for different CrossFire configurations:

            ### 📦 Firmware Files

            **`crossgrbl-inverted-*.hex`** - **RECOMMENDED FOR MACH3 CONVERSIONS**
            - For original Mach3-based CrossFire tables
            - Inverts both X and Y axis directions (`$3=3`)
            - Use if BOTH axes move backwards with standard firmware

            **`crossgrbl-standard-*.hex`** - For Standard Langmuir Wiring
            - For newer CrossFire models with standard wiring
            - No axis direction inversion (`$3=0`)
            - Matches official Langmuir grbl-ls configuration

            ### 🔧 Installation

            Flash the firmware using arduino-cli:
            ```bash
            arduino-cli upload -p COMxx --fqbn arduino:avr:uno --input-file crossgrbl-inverted-*.hex
            ```

            Or using avrdude:
            ```bash
            avrdude -c arduino -p atmega328p -P COMxx -b 115200 -U flash:w:crossgrbl-inverted-*.hex:i
            ```

            Replace `COMxx` with your actual COM port.

            ### ⚠️ Which firmware should you use?

            **Start with `standard` firmware** and test:
            - +X → should move RIGHT
            - -X → should move LEFT
            - +Y → should move AWAY (back)
            - -Y → should move TOWARD you (front)

            If BOTH axes move backwards, use the `inverted` firmware.

            See the [README](https://github.com/ril3y/crossgrbl#firmware-versions) for more details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
