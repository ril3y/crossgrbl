name: Build Firmware

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr

      - name: Create build directory
        run: mkdir -p build

      - name: Build firmware
        run: make

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossgrbl-firmware
          path: grbl.hex
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            grbl.hex
          body: |
            ## CrossGRBL Firmware Release

            ### Changes in this release:
            - Fixed X and Y axis direction for Langmuir CrossFire
            - Set `DEFAULT_DIRECTION_INVERT_MASK` to invert both X and Y axes

            ### Installation:

            Flash the firmware using arduino-cli:
            ```bash
            arduino-cli upload -p COMxx --fqbn arduino:avr:uno --input-file grbl.hex
            ```

            Or using avrdude:
            ```bash
            avrdude -c arduino -p atmega328p -P COMxx -b 115200 -U flash:w:grbl.hex:i
            ```

            Replace `COMxx` with your actual COM port.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
